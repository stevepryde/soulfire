[workspace]
resolver = "3"
members = [
    "libs/lib-soulfire",
    "libs/ai-client",
    "libs/sp-core",
    "libs/sp-markdown",
    "libs/sp-ui",
    "app",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Steve Pryde <steve@stevepryde.com>"]
repository = "https://github.com/stevepryde/soulfire"
rust-version = "1.96"

# Intra-workspace vendored crates. Source is copied/adapted from the owner's
# private crates (ai-client, splibs) per specs/12-platform-packaging.md — no
# git or crates.io dependency on them. Each is filled in as a deliberate slice.
[workspace.dependencies]
lib-soulfire = { path = "libs/lib-soulfire" }
ai-client = { path = "libs/ai-client" }
sp-core = { path = "libs/sp-core" }
sp-markdown = { path = "libs/sp-markdown" }
sp-ui = { path = "libs/sp-ui" }

# Third-party dependencies shared across the vendored crates and the app.
# Versions track Soulfire-OG's workspace; `dioxus` targets the native
# desktop/mobile renderers (no web), per specs/12-platform-packaging.md.
anyhow = "1"
bon = "3"
# jiff over chrono: better IANA tzdb handling across desktop + mobile (notably
# Android's concatenated tzdata) and an actively-developed Temporal-based API.
# Lives behind sp-core's SpDateTime wrapper, so the choice stays swappable.
jiff = "0.2"
dioxus = { version = "0.7" }
indexmap = "2"
paste = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
