[workspace]
resolver = "3"
members = [
    "libs/soulfire-core",
    "libs/ai-client",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Steve Pryde <steve@stevepryde.com>"]
repository = "https://github.com/stevepryde/soulfire"
rust-version = "1.96"

# Intra-workspace crates. The public app keeps product/domain logic in
# `soulfire-core`; `ai-client` remains a small provider transport adapter for
# now.
[workspace.dependencies]
ai-client = { path = "libs/ai-client" }
soulfire-core = { path = "libs/soulfire-core" }

# Third-party dependencies shared across the Rust core crates.
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
bon = "3"
getrandom = "0.3"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10"
tempfile = "3"
zeroize = "1.8"
# jiff over chrono: better IANA tzdb handling across desktop + mobile (notably
# Android's concatenated tzdata) and an actively-developed Temporal-based API.
# Lives behind soulfire-core's SfDateTime wrapper, so the choice stays swappable.
jiff = "0.2"
futures = "0.3"
indexmap = "2"
paste = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
