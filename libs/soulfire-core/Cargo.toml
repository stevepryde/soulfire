[package]
name = "soulfire-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Soulfire's pure-Rust engine: store, AI orchestration, prompts, and the chat/world turn engines."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
regex = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
rusqlite = { workspace = true }
ai-client = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
paste = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "rt-multi-thread", "test-util"] }
