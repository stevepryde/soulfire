[package]
name = "soulfire-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Soulfire's pure-Rust engine: store, AI orchestration, prompts, and the chat/world turn engines."

[dependencies]
lib-soulfire = { workspace = true }
sp-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
rusqlite = { workspace = true }
ai-client = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "rt-multi-thread", "test-util"] }

